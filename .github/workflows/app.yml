# Pipeline 2: the APP. test -> build + push -> deploy onto the VM.
#   - pull request touching app/ -> test and build only (nothing is published)
#   - push to main touching app/ -> test, push app:<sha>, deploy it to the VM
# GCP access: its own service account (app-deployer) via OIDC, no JSON key.
# It can push images and read the VM's IP; it cannot create or delete VMs.
# VM access: plain SSH with the private key stored in the SSH_PRIVATE_KEY
# secret (the matching .pub is what infra put on the VM).
#
# Repository variables: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER,
# GCP_APP_SERVICE_ACCOUNT, VM_NAME (default demo-c4-vm), GCP_ZONE
# (default us-central1-a), SSH_USER (default deploy), AR_REPOSITORY
# (default infra-cloud-template). Secret: SSH_PRIVATE_KEY.
name: app

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: us-central1
  ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
  VM_NAME: ${{ vars.VM_NAME || 'prueba-vm' }}
  SSH_USER: ${{ vars.SSH_USER || 'deploy' }}
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY || 'infra-cloud-template' }}/prueba-app:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pytest (the same command as on the laptop)
        working-directory: app
        run: uv run --python 3.12 --with-requirements requirements.txt --with pytest --with httpx pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # only this job and deploy may ask for an OIDC token
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build --build-arg "APP_VERSION=${GITHUB_SHA::7}" -t "$IMAGE" ./app

      - name: Smoke test (GET /healthz)
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE"
          curl -sf --retry 20 --retry-delay 1 --retry-all-errors http://localhost:8080/healthz
          docker rm -f smoke

      # Pull requests stop here: tested and built, nothing published.
      - id: auth
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: github.event_name != 'pull_request'

      - name: docker push
        if: github.event_name != 'pull_request'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: VM public IP
        run: |
          IP=$(gcloud compute instances describe "$VM_NAME" --zone "$ZONE" --format='value(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "IP=$IP" >> "$GITHUB_ENV"

      - name: SSH key from the secret
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

      # Exactly what you would type by hand on the VM: pull, remove the old
      # container, run the new one with the same volume.
      - name: docker pull + run on the VM (ssh)
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new "$SSH_USER@$IP" "
            sudo docker pull $IMAGE &&
            (sudo docker rm -f app || true) &&
            sudo docker run -d --name app --restart unless-stopped -p 8080:8080 -v app-data:/data $IMAGE"

      - name: Check the new version answers
        run: |
          curl -sf --retry 20 --retry-delay 2 --retry-all-errors "http://$IP:8080/" | tee /dev/stderr | grep -q "\"version\":\"${GITHUB_SHA::7}\""
          echo "::notice::deployed ${GITHUB_SHA::7} at http://$IP:8080/"
